<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clawtrate prototype: voice</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/conversation.css" />
    <link rel="stylesheet" href="css/bots.css" />
    <link rel="stylesheet" href="css/voice.css" />
    <link rel="stylesheet" href="css/prototype.css" />
    <!-- Optional and not in the repository: local @font-face rules. See README.md. -->
    <link rel="stylesheet" href="fonts.local.css" />
    <script src="js/icons.js"></script>
    <script src="js/prototype.js"></script>
    <script src="js/components.js" defer></script>
    <script src="js/voice.js" defer></script>
  </head>
  <body>
    <header class="proto-bar" id="proto-bar"></header>
    <main class="proto-stage">
      <div class="proto-frame">
        <!-- The shell's own structure, drawn by js/voice.js for what
             docs/design/voice.md needs: the rail, a task, the call band, the
             composer's two buttons, and Settings with its Voice section. The
             system's microphone prompt is a picture, labelled as one. -->
        <div class="app" id="root">
          <div class="shell" data-panel="closed" data-view="detail">
            <nav class="rail" aria-label="Bots">
              <div class="rail-top">
                <button type="button" class="icon-button rail-status" data-v="settings" aria-label="Settings" title="Settings (⌘,)">
                  <i data-icon="settings"></i>
                  <span class="status-dot" data-status="connected" id="rail-dot"></span>
                </button>
              </div>
              <ul class="bot-list" id="bot-list" data-testid="bot-list"></ul>
              <div class="rail-footer">
                <div class="gateway-pill">
                  <span class="status-dot" data-status="connected" id="gateway-dot"></span>
                  <span class="gateway-pill-text">
                    <strong>Home gateway</strong>
                    <span id="gateway-state">Connected</span>
                  </span>
                </div>
              </div>
            </nav>

            <div class="main-pane">
              <section class="conversation" aria-label="Conversation">
                <div class="status-strip" id="status-strip" role="status" data-testid="status-strip" hidden></div>
                <header class="conversation-header">
                  <div class="header-side">
                    <button type="button" class="icon-button back-button" data-v="back" aria-label="Back to bots">
                      <i data-icon="back"></i>
                    </button>
                  </div>
                  <div class="title-pill" id="title-pill"></div>
                  <div class="header-side" data-side="end"></div>
                </header>
                <div class="transcript-wrap">
                  <div class="transcript" id="transcript" tabindex="0" data-testid="transcript"></div>
                </div>
                <div id="call-slot"></div>
                <footer class="composer" id="composer"></footer>
              </section>
            </div>
          </div>
          <p class="visually-hidden" id="live" aria-live="polite" data-testid="live"></p>
          <dialog class="b-dialog" id="consent-dialog" data-kind="confirm" aria-labelledby="consent-title"></dialog>
          <dialog class="b-dialog" id="confirm-dialog" data-kind="confirm" aria-labelledby="confirm-title"></dialog>
          <dialog class="b-dialog" id="settings-dialog" data-kind="settings" aria-labelledby="settings-title"></dialog>
          <!-- Prototype chrome: a picture of the system's microphone prompt. Not product code. -->
          <div class="v-os-layer" id="os-layer" hidden></div>
        </div>
      </div>
    </main>
  </body>
</html>
