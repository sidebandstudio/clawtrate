<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clawtrate prototype: a bot's row opens its main conversation</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/prototype.css" />
    <link rel="stylesheet" href="css/bot-main.css" />
    <!-- Optional and not in the repository: local @font-face rules. See README.md. -->
    <link rel="stylesheet" href="fonts.local.css" />
    <script src="js/prototype.js"></script>
    <script src="js/creatures.js"></script>
    <script src="js/bot-main.js" defer></script>
  </head>
  <body>
    <header class="proto-bar" id="proto-bar"></header>
    <main class="proto-stage">
      <div class="proto-frame">
        <!-- docs/design/bot-opens-main.md. js/bot-main.js draws one state from
             the address (side=, bot=, task=, view=, menu=, pane=) and lets the
             rows, the folds and the Tasks menu be clicked. -->
        <div class="bm" id="bm-root" data-testid="bot-main"></div>
        <p class="visually-hidden" id="bm-live" role="status" aria-live="polite"></p>
      </div>
    </main>
  </body>
</html>
