<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- connect-src 'none': the fixture mode makes no requests of its own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; script-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <!-- Dark until the stylesheet applies the chosen theme, so the first frame is never light. -->
    <meta name="color-scheme" content="dark" />
    <title>Clawtrate fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
