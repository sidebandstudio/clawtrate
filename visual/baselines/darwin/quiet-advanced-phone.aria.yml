- dialog "Settings":
  - region "Advanced":
    - button "Close settings"
    - button "Back to settings"
    - heading "Advanced" [level=3]
    - text: Show commands
    - switch "Show commands"
    - paragraph: Shows each action as its own card with its command or call, in the conversation and the Computer tab.
    - text: Show thinking
    - switch "Show thinking"
    - paragraph: "Shows a bot's reasoning: Thought lines in the conversation, and its thinking while it works."
    - text: Show external channel chats
    - switch "Show external channel chats"
    - paragraph:
      - text: Off by default. Chats that reach a bot through Discord, Telegram, Slack, iMessage, WhatsApp, Signal or another channel stay out of the task list, its previews and its unread marks. A bot's main conversation always shows. If the gateway sends a channel's direct messages to it, which it does unless its
      - code: session.dmScope
      - text: setting gives each channel conversation its own session, those messages still appear there.
