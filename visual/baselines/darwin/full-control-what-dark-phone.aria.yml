- main:
  - heading "Clawtrate" [level=1]
  - paragraph: Your OpenClaw agents, orchestrated.
  - region "Connect to your gateway":
    - heading "Connect to your gateway" [level=2]
    - text: Gateway address
    - textbox "Gateway address": wss://gateway.example
    - text: Gateway token, for pairing
    - textbox "Gateway token, for pairing"
    - paragraph:
      - text: Full control lets Clawtrate change gateway settings, approve devices and, when the gateway allows it, open a terminal on the computer running OpenClaw.
      - button "What this means" [expanded]
    - list:
      - listitem: The terminal runs as the gateway's user and inherits that process's environment. It is on by default, within the gateway's and the sandbox's limits.
      - listitem: Disconnecting this device leaves its pairing on the gateway. Removing it (Settings, Gateway, Devices, from another admin device) ends that pairing.
      - listitem: If this device is lost, remove it from another admin connection.
      - listitem: If the shared token leaked, rotate it on the gateway and review the other paired devices.
      - listitem: Protecting this app's data limits copies made from backups and app files. It doesn't protect a computer that is already compromised.
    - button "Connect a gateway"
    - button "Use the development gateway"
    - paragraph: Clawtrate works with an OpenClaw gateway you already run. At a secure address (wss://) that isn't localhost, it asks once for full control; at any other address it asks for read access only.
