- main "Routines":
  - button "Back to routines"
  - heading "Certificate renewal" [level=1]
  - paragraph: Otto
  - button "Run now"
  - button "More"
  - status: Runs on "0 9 1 * *, gateway's time".
  - heading "Instruction" [level=3]
  - paragraph: Renew the home server's certificate if it expires within 30 days.
  - heading "When to run" [level=3]
  - term: Schedule
  - definition:
    - code: 0 9 1 * *
    - text: in the gateway's cron format
  - term: Time zone
  - definition: The gateway's own time zone
  - term: Next run
  - definition: Tue Dec 1, 3:00 AM Your time. The schedule itself runs in the gateway's time zone.
  - term: Runs in
  - definition: A new conversation each time
  - term: Results
  - definition: Kept with the run
  - term: Triggers
  - definition: Its schedule only. This gateway's webhooks start a bot directly, not a routine.
  - region "Runs":
    - heading "Runs" [level=3]
    - list "Runs":
      - listitem:
        - button "Oct 29 6:40 PM, Succeeded · 2.6 s · 200 tokens": Oct 29 6:40 PM Succeeded · 2.6 s · 200 tokens
      - listitem:
        - button "Oct 28 6:40 PM, Succeeded · 2.6 s · 200 tokens": Oct 28 6:40 PM Succeeded · 2.6 s · 200 tokens
      - listitem:
        - button "Oct 27 6:40 PM, Succeeded · 2.6 s · 200 tokens": Oct 27 6:40 PM Succeeded · 2.6 s · 200 tokens
    - paragraph: Clawtrate shows the 20 runs that finished most recently. By default the gateway keeps 7 days of runs, and each run's conversation for 24 hours; it can be set to keep them longer.
  - status
  - dialog "Edit routine":
    - heading "Edit routine" [level=2]
    - button "Close"
    - group:
      - text: Bot
      - paragraph: Otto. To run it on another bot, make a new routine.
      - text: Name
      - textbox "Name": Certificate renewal
      - text: Instruction
      - textbox "Instruction":
        - /placeholder: "What should Otto do each time? For example: Summarise yesterday's notes and list anything I need to answer."
        - text: Renew the home server's certificate if it expires within 30 days.
      - text: When
      - code: 0 9 1 * *
      - text: This schedule was set on the gateway. You can rename the routine and change its instruction here; change its schedule on the gateway.
      - group: More
    - button "Cancel"
    - button "Save"
- status
