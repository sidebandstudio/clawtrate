          - cell "213 GB"
    - paragraph:
      - text: I moved the cache to
      - code: transcode-cache.old
      - text: "instead of deleting it. To undo:"
    - code: mv /var/lib/transcode-cache.old /var/lib/transcode-cache
    - paragraph:
      - text: I will remove it in a week unless you say otherwise. The size check (
