- status
- main "Routines":
  - button "Back to bots"
  - heading "Routines" [level=1]
  - radiogroup "Show":
    - radio "List" [checked]
    - radio "Day"
  - button "New routine"
  - combobox "Bots":
    - option "All bots" [selected]
    - option "Juniper"
    - option "Marlow"
    - option "Otto"
    - option "Pip"
    - option "Quartermaster of the Family Calendar and Errands"
  - text: 8 routines
  - region "Juniper":
    - heading "Juniper" [level=2]
    - text: Checks in every 30 minutes
    - list "Juniper":
      - listitem:
        - button "Stretch break, Juniper, Every 2 hours, next run today 6:20 PM, last today, succeeded": Stretch break Every 2 hours · Next today 6:20 PM · Last today, succeeded
        - switch "Stretch break runs on schedule" [checked]
  - region "Marlow":
    - heading "Marlow" [level=2]
    - text: No check-ins
    - list "Marlow":
      - listitem:
        - button "Morning digest, Marlow, Weekdays at 8:00 AM, New York, next run tomorrow 8:00 AM, last today, succeeded": Morning digest Weekdays at 8:00 AM, New York · Next tomorrow 8:00 AM · Last today, succeeded
        - switch "Morning digest runs on schedule" [checked]
      - listitem:
        - button "Send the draft to Sam, Marlow, Once, Nov 18, 2026 at 9:00 AM, New York, next run Wed 9:00 AM, no runs yet": Send the draft to Sam Once, Nov 18, 2026 at 9:00 AM, New York · Next Wed 9:00 AM · No runs yet
        - switch "Send the draft to Sam runs on schedule" [checked]
  - region "Otto":
    - heading "Otto" [level=2]
    - text: No check-ins
    - list "Otto":
      - listitem:
        - button "Disk space watch, Otto, Every 30 minutes, next run today 5:52 PM, last today, skipped": Disk space watch Every 30 minutes · Next today 5:52 PM · Last today, skipped
        - switch "Disk space watch runs on schedule" [checked]
      - listitem:
        - button "Nightly backup check, Otto, Every day at 3:30 AM, New York, next run tomorrow 3:30 AM, last today, failed": Nightly backup check Every day at 3:30 AM, New York · Next tomorrow 3:30 AM · Last today, failed
        - switch "Nightly backup check runs on schedule" [checked]
      - listitem:
        - button "Certificate renewal, Otto, 0 9 1 * *, gateway's time, next run Dec 1 3:00 AM, last oct 29, succeeded":
          - text: Certificate renewal
          - code: 0 9 1 * *
          - text: ", gateway's time · Next Dec 1 3:00 AM · Last Oct 29, succeeded"
        - switch "Certificate renewal runs on schedule" [checked]
  - region "Pip":
    - heading "Pip" [level=2]
    - text: No check-ins
    - list "Pip":
      - listitem:
        - button "Plan the week, Pip, Sundays at 5:00 PM, London, next run Sun 5:00 PM, last nov 13, succeeded": Plan the week Sundays at 5:00 PM, London · Next Sun 5:00 PM · Last Nov 13, succeeded
        - switch "Plan the week runs on schedule" [checked]
      - listitem:
        - button "Inbox tidy-up, Pip, paused, Fridays at 4:00 PM, New York": Inbox tidy-up Paused · Fridays at 4:00 PM, New York
        - switch "Inbox tidy-up runs on schedule"
  - status
  - dialog "New routine":
    - heading "New routine" [level=2]
    - button "Close"
    - group:
      - text: Bot
      - combobox "Bot":
        - option "Juniper" [selected]
        - option "Marlow"
        - option "Otto"
        - option "Pip"
        - option "Quartermaster of the Family Calendar and Errands"
      - text: Name
      - textbox "Name"
      - text: Instruction
      - textbox "Instruction":
        - /placeholder: "What should Juniper do each time? For example: Summarise yesterday's notes and list anything I need to answer."
      - text: When
      - radiogroup "When":
        - listitem:
          - radio "Every day"
        - listitem:
          - radio "Weekdays" [checked]
        - listitem:
          - radio "Some days of the week"
        - listitem:
          - radio "Every few hours or minutes"
        - listitem:
          - radio "Once"
      - text: At
      - textbox "At": 08:00
      - text: Time zone
      - combobox "Time zone":
        - option "Auto-detect (New York)" [selected]
      - paragraph: Writes this device's zone, America/New_York. It does not follow the device later.
      - paragraph: "Runs weekdays at 8:00 AM, New York time. Next: Tue Nov 17, 8:00 AM, then Wed Nov 18, Thu Nov 19."
      - group: More
    - paragraph: It runs first at its next time; creating it doesn't run it.
    - button "Cancel"
    - button "Save"
- status
