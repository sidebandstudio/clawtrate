- dialog "Settings":
  - region "Updates":
    - button "Close settings"
    - button "Back to settings"
    - heading "Updates" [level=3]
    - paragraph: Applies on this device.
    - term: Version
    - definition:
      - text: Clawtrate 0.1.0
      - paragraph: This copy is a Stable build.
    - radiogroup "Update track":
      - text: Update track
      - radio "Stable" [checked] [disabled]
      - text: Stable
      - radio "Beta" [disabled]
      - text: Beta
    - group "Update status":
      - term: Updates
      - definition: Clawtrate handed the update to the macOS updater. After restart, Clawtrate reports the version that is running.
    - status: Clawtrate handed the update to the macOS updater. After restart, Clawtrate reports the version that is running.
