    - region "OpenClaw on 127.0.0.1:18789":
      - heading "OpenClaw on 127.0.0.1:18789" [level=4]
      - paragraph: Applies to the gateway, for every device connected to it.
      - paragraph: OpenClaw 2026.11.6 is out. The gateway runs 2026.10.6.
      - button "Update OpenClaw to 2026.11.6"
      - alertdialog "Update OpenClaw?":
        - heading "Update OpenClaw?" [level=2]
        - paragraph: Your gateway goes from OpenClaw 2026.10.6 to 2026.11.6.
        - paragraph: An update usually takes 5 to 15 minutes, and some installs take longer. The gateway restarts during it, so your bots can't be reached for part of that time. Clawtrate reconnects by itself.
        - paragraph: 1 task is working now, and will be stopped when the gateway restarts. Stopped work may not be picked up again.
        - button "Not now"
        - button "Update"
