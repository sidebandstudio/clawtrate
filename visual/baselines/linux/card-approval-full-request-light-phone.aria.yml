- region "Otto wants to run a command. Needs approval.":
  - heading "Otto wants to run a command" [level=3]
  - text: Needs approval
  - paragraph:
    - text: Run
    - code: mv /srv/media/transcode-cache /srv/scratch/transcode-cache
    - text: on media-box.
  - list:
    - listitem: This can't be undone
  - group:
    - text: Hide full request
    - code: mv /srv/media/transcode-cache /srv/scratch/transcode-cache
    - button "Copy command"
    - paragraph: Arguments
    - list "Arguments":
      - listitem:
        - code: mv
      - listitem:
        - code: /srv/media/transcode-cache
      - listitem:
        - code: /srv/scratch/transcode-cache
    - term: Runs on
    - definition: media-box
    - term: Folder
    - definition: /srv/media
    - term: Asked by
    - definition: Otto
    - term: Warning
    - definition: Moves a folder outside Otto's own workspace.
  - button "Allow once"
  - button "Always allow…"
  - button "Deny"
  - paragraph: Expires in 28 minutes; the command is not run if it does.
  - button "Raw"
