<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The interface draws its text in Figtree and JetBrains Mono, served with the fixture. A
     character neither has falls back to these, first, instead of to whichever installed font
     fontconfig would rank highest for it. Emoji keep Noto Color Emoji. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
