<!doctype html>
<!--
  The link preview card, drawn by `pnpm brand:cards` (src/make-cards.ts) at each
  size it writes. The script fills .cast with the website's parade of Claws.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clawtrate link preview</title>
    <style>
      @font-face {
        font-family: "Figtree";
        src: url("../../site/fonts/figtree-latin-wght-normal.woff2") format("woff2");
        font-weight: 300 900;
      }
      * {
        animation: none !important;
        transition: none !important;
      }
      html,
      body {
        margin: 0;
      }
      body {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #101112;
        color: #f3f3f2;
        font-family: "Figtree", sans-serif;
      }
      /* The mark's mint, faint behind the name, and the close band's green under the Claws. */
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(48% 52% at 50% 36%, rgba(62, 230, 193, 0.11), transparent 72%),
          linear-gradient(to bottom, transparent 58%, #0c2e27 100%);
      }
      .lockup {
        position: absolute;
        top: 21.5%;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .mark {
        display: block;
        width: 124px;
        height: 124px;
        border-radius: 29px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.09),
          0 18px 44px rgba(0, 0, 0, 0.55);
      }
      h1 {
        margin: 0;
        font-size: 132px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.035em;
        /* Figtree's caps sit high in the line box: this centres the word on the mark. */
        translate: 0 -6px;
      }
      p {
        margin: 0;
        color: #b4b6b9;
        font-size: 42px;
        font-weight: 450;
        letter-spacing: -0.01em;
      }
      .cast {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 1060px;
        translate: -50% 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .pc {
        flex: none;
        width: 138px;
        translate: 0 16%;
      }
      .pc:nth-child(odd) {
        width: 116px;
        translate: 0 11%;
      }
      /* The dozing Claw's Zs belong to its habit on the site, not its rest. */
      .pc-zs {
        display: none;
      }
      /* The site's still poses (site/style.css, "The Claws"). */
      .claw-art {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .claw-art [data-s] {
        display: none;
      }
      .claw-art[data-state="idle"] [data-s~="idle"] {
        display: inline;
      }
      .lantern .halo {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="lockup">
      <div class="name">
        <img class="mark" src="../../assets/brand/logo.png" alt="" />
        <h1>Clawtrate</h1>
      </div>
      <p>Your OpenClaw agents, orchestrated.</p>
    </div>
    <div class="cast"></div>
  </body>
</html>
