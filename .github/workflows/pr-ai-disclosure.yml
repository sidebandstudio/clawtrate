name: PR AI disclosure

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ai-disclosure-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  disclosure:
    name: PR AI disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the decision's script, from the same commit as this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkDisclosure } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-ai-disclosure.mjs`
            );
            // Read the current body, including when someone reruns an older check.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            const problem = await checkDisclosure({
              // The author comes from the event, which no one but GitHub writes.
              author: context.payload.pull_request.user,
              body: pr.body,
              render: async (text) => (await github.rest.markdown.render({ text, mode: "markdown" })).data,
            });
            if (problem) core.setFailed(problem);
