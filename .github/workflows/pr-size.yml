name: PR size

# Labels each pull request with its size, from size: XS to size: XXL. It never blocks a merge.
# pull_request_target runs this file as it is on main, with a token that can label. It reads the
# pull request's file list through the API and never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // The lockfile and the screenshot baselines are generated, so they do not count.
            const counted = files.filter(
              (f) => f.filename !== "pnpm-lock.yaml" && !f.filename.startsWith("visual/baselines/"),
            );
            const lines = counted.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const limits = [
              [10, "XS"],
              [30, "S"],
              [100, "M"],
              [500, "L"],
              [1000, "XL"],
            ];
            const size = limits.find(([limit]) => lines < limit)?.[1] ?? "XXL";
            const wanted = `size: ${size}`;
            const current = pr.labels.map((label) => label.name);
            for (const name of current) {
              if (name.startsWith("size: ") && name !== wanted) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              }
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [wanted],
              });
            }
            core.info(`${lines} changed lines in ${counted.length} files: ${wanted}`);
