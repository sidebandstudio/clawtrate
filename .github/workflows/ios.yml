name: iOS

# A run holds four macOS runners for about an hour and a half, so pull requests run it only
# when they change the iPhone app or this workflow. Most desktop pull requests
# change the shared code the app builds from, so that is checked once a day on
# main. Use workflow_dispatch to run it on a branch sooner.
on:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "apps/mobile/**"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The checks are split across four jobs by apps/mobile/simulator/jobs.ts, which lists each
  # job's checks; the last job also runs every check no list names. Each job builds, boots and
  # seeds on its own (about 30 minutes here) and then runs about an hour of checks. One job's
  # failure doesn't stop the others, so a run reports every job's result.
  simulator:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4]
    # About 1.6 times the longest job's expected time on GitHub's runner.
    timeout-minutes: 150
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CLAWTRATE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global openclaw@2026.10.6
      # The development gateway runs this runner's copy, which is the pinned version.
      - run: echo "OPENCLAW_BIN=$(npm prefix --global)/bin/openclaw" >> "$GITHUB_ENV"
      - name: Install Maestro
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip \
            --output maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  maestro.zip" \
            | shasum --algorithm 256 --check
          unzip -q maestro.zip
          echo "MAESTRO=$RUNNER_TEMP/maestro/bin/maestro" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
      - run: pnpm mobile:build
      - run: |
          pattern=$(node apps/mobile/simulator/jobs.ts ${{ matrix.job }})
          pnpm mobile:check --bail=1 --reporter=verbose --testNamePattern="$pattern"
      # What a failed check saw: Maestro's screenshots and screen hierarchies, kept for a few
      # days. Only those: each step's flow, command list and log hold the token it typed.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-maestro-${{ matrix.job }}
          path: |
            apps/mobile/build/maestro/**/screenshots/*.png
            apps/mobile/build/maestro/**/screen-hierarchy/*.json
          include-hidden-files: true
          retention-days: 3

  # A scheduled run's failure shows only in the Actions tab, so it is kept in one open issue,
  # found by its label, until a later scheduled run passes. This is its own job so that the
  # Simulator job keeps contents: read, and so that a failure here cannot mask the Simulator's.
  # cancelled() is the whole run, replaced by a newer one; a Simulator job past its
  # timeout-minutes is cancelled alone, and is reported like a failure. The result is the
  # matrix's: success only when every Simulator job passed.
  report:
    needs: simulator
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.simulator.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: "ci: daily ios"
    steps:
      - run: |
          [ "$RESULT" = skipped ] && exit 0
          open=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The scheduled run $RUN_URL passed on main at $GITHUB_SHA."
            fi
            exit 0
          fi
          ended=failed
          [ "$RESULT" = cancelled ] && ended="did not finish in its time limit"
          message="The scheduled run $RUN_URL $ended on main at $GITHUB_SHA."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$message"
          else
            gh label create "$LABEL" --force --color b60205 \
              --description "The daily iPhone Simulator check on main is failing"
            gh issue create --title "The daily iPhone Simulator check is failing" --label "$LABEL" --body "$message"
          fi
