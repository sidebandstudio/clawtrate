name: iOS

# A run holds a macOS runner for an hour or more, so pull requests run it only
# when they change the iPhone app or this workflow. Most desktop pull requests
# change the shared code the app builds from, so that is checked once a day on
# main. Use workflow_dispatch to run it on a branch sooner.
on:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "apps/mobile/**"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: xcode-27
    # A slow hosted Simulator can need more than three hours for the full suite.
    timeout-minutes: 240
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CLAWTRATE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global openclaw@2026.10.6
      - name: Install Maestro
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip \
            --output maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  maestro.zip" \
            | shasum --algorithm 256 --check
          unzip -q maestro.zip
          echo "MAESTRO=$RUNNER_TEMP/maestro/bin/maestro" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
      - run: pnpm mobile:build
      - run: pnpm mobile:check --bail=1 --reporter=verbose

  # A scheduled run's failure shows only in the Actions tab, so it is kept in one open issue,
  # found by its label, until a later scheduled run passes. This is its own job so that the
  # Simulator job keeps contents: read, and so that a failure here cannot mask the Simulator's.
  # cancelled() is the whole run, replaced by a newer one; a Simulator job past its
  # timeout-minutes is cancelled alone, and is reported like a failure.
  report:
    needs: simulator
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.simulator.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: "ci: daily ios"
    steps:
      - run: |
          [ "$RESULT" = skipped ] && exit 0
          open=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The scheduled run $RUN_URL passed on main at $GITHUB_SHA."
            fi
            exit 0
          fi
          ended=failed
          [ "$RESULT" = cancelled ] && ended="did not finish in its time limit"
          message="The scheduled run $RUN_URL $ended on main at $GITHUB_SHA."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$message"
          else
            gh label create "$LABEL" --force --color b60205 \
              --description "The daily iPhone Simulator check on main is failing"
            gh issue create --title "The daily iPhone Simulator check is failing" --label "$LABEL" --body "$message"
          fi
