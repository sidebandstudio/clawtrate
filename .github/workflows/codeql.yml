name: CodeQL

# Code scanning for the languages the repository has: TypeScript and JavaScript, the workflow
# files, the C helper and the Python script under apps/desktop/packaging. None needs a build.
# The Objective-C helpers are outside what CodeQL reads, and the one Swift file is a fragment the
# mobile app's config plugin copies into a generated iOS project, with no project here to build.
#
# It runs on each push to main and once a week, not on every pull-request push, so pull requests
# don't wait for Linux runners behind it. A finding on main shows in the repository's Security tab.
on:
  push:
    branches: [main]
  schedule:
    # Mondays at 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes an analysis still running for an older one.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      # The same category per language as before, so existing alerts carry over.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
