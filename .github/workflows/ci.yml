name: CI

on:
  push:
    branches: [main, w1-windows-ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Lint, typecheck and unit tests do not start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A unit test reads the gateway's own tool-naming function from the installed package.
      - run: npm install --global openclaw@2026.10.6
      # The development gateway's browser tests start the Chromium that Playwright installs.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gateway version the project tests against (docs/decisions.md), from the public registry.
      - run: npm install --global openclaw@2026.10.6
      - run: openclaw --version
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # What a failed check saw: traces and error contexts, kept for a few days.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 3

  macos:
    # The visual baselines were taken on macOS 15; font rasterising differs between releases.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm visual
      # What a failed check saw: the actual and difference pictures, traces and error contexts.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: test-results/
          retention-days: 3
      # Unsigned: no signing variables are set, so the app is signed ad hoc and not notarized.
      - run: pnpm package:mac

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # The repository's line endings, as on macOS and Linux.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unsigned: no signing variables are set.
      - run: pnpm package:win
      # For inspection only: unsigned, and never a release.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/dist/Clawtrate-*-win-x64.exe
          if-no-files-found: error
          retention-days: 3
      - name: Install for the current user, silently, into a folder of its own
        id: install
        run: |
          $installer = @(Get-ChildItem apps/desktop/dist/Clawtrate-*-win-x64.exe)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          # A space in the path, as a folder a person picks may have. NSIS takes /D= last and unquoted.
          $dir = Join-Path $env:RUNNER_TEMP "Clawtrate install"
          $run = Start-Process $installer[0].FullName -ArgumentList '/S', '/currentuser', "/D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installer exited with $($run.ExitCode)" }
          foreach ($file in 'Clawtrate.exe', 'resources\app.asar', 'Uninstall Clawtrate.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "the installer did not write $file" }
          }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -like 'Clawtrate*' }
          if (@($entry).Count -ne 1) { throw "expected one uninstall entry for Clawtrate, found $(@($entry).Count)" }
          $entry | Select-Object DisplayName, DisplayVersion, InstallLocation, Publisher | Format-List
          # The silent install must not start the app; the check starts its own.
          $running = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$dir\*" }
          if ($running) { throw "the installer left the app running: $($running.ProcessId -join ', ')" }
          "dir=$dir" >> $env:GITHUB_OUTPUT
      # Temporary: what the runner's taskbar shows for the installed app.
      - continue-on-error: true
        run: |
          $dir = '${{ steps.install.outputs.dir }}'
          "this shell's session: $((Get-Process -Id $PID).SessionId)"
          Get-Process explorer -ErrorAction SilentlyContinue | Format-Table Id, SessionId
          $ud = Join-Path $env:RUNNER_TEMP 'diag-user-data'
          $app = Start-Process (Join-Path $dir 'Clawtrate.exe') -ArgumentList "--user-data-dir=$ud" -PassThru
          Start-Sleep -Seconds 10
          "app session: $($app.SessionId), title: $((Get-Process -Id $app.Id).MainWindowTitle)"
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $ae = [Windows.Automation.AutomationElement]
          $all = [Windows.Automation.Condition]::TrueCondition
          foreach ($top in $ae::RootElement.FindAll([Windows.Automation.TreeScope]::Children, $all)) {
            "top: $($top.Current.ClassName) | $($top.Current.Name)"
            if ($top.Current.ClassName -in 'Shell_TrayWnd', 'Shell_SecondaryTrayWnd') {
              foreach ($el in $top.FindAll([Windows.Automation.TreeScope]::Descendants, $all)) {
                "  $($el.Current.ControlType.ProgrammaticName) | $($el.Current.ClassName) | id=$($el.Current.AutomationId) | name=$($el.Current.Name) | help=$($el.Current.HelpText)"
              }
            }
          }
          $env:CHECK_EXE = Join-Path $dir 'Clawtrate.exe'
          "--- the check's own function, from node:"
          node --input-type=module -e "const m = await import('./e2e-packaged/windows.ts'); const t = Date.now(); console.log(JSON.stringify(m.taskbarOverlayDescription(process.env.CHECK_EXE)), Date.now() - t, 'ms')"
          $variant = @'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $ae = [Windows.Automation.AutomationElement]
          $all = [Windows.Automation.Condition]::TrueCondition
          $bar = $ae::RootElement.FindFirst([Windows.Automation.TreeScope]::Children, (New-Object Windows.Automation.PropertyCondition($ae::ClassNameProperty, 'Shell_TrayWnd')))
          "PS $($PSVersionTable.PSVersion) bar: $([bool]$bar)"
          foreach ($el in $bar.FindAll([Windows.Automation.TreeScope]::Descendants, $all)) { if ($el.Current.AutomationId -like 'Appid:*') { "  all: [$($el.Current.AutomationId)]" } }
          $want = 'Appid: ' + $env:CHECK_EXE
          "want: [$want]"
          $exact = $bar.FindFirst([Windows.Automation.TreeScope]::Descendants, (New-Object Windows.Automation.PropertyCondition($ae::AutomationIdProperty, $want)))
          "exact: $([bool]$exact)"
          $nocase = $bar.FindFirst([Windows.Automation.TreeScope]::Descendants, (New-Object Windows.Automation.PropertyCondition($ae::AutomationIdProperty, $want, [Windows.Automation.PropertyConditionFlags]::IgnoreCase)))
          "ignorecase: $([bool]$nocase)"
          '@
          $variant | Set-Content (Join-Path $env:RUNNER_TEMP 'variant.ps1')
          "--- Windows PowerShell:"
          powershell.exe -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP 'variant.ps1')
          "--- PowerShell 7:"
          pwsh -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP 'variant.ps1')
          taskkill /F /T /PID $app.Id
      - name: Run the launch check against the installed app
        env:
          CLAWTRATE_PACKAGED_APP: ${{ steps.install.outputs.dir }}
        run: pnpm check:packaged
      - name: Uninstall silently and check nothing is left
        run: |
          $dir = '${{ steps.install.outputs.dir }}'
          $run = Start-Process (Join-Path $dir 'Uninstall Clawtrate.exe') -ArgumentList '/S' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the uninstaller exited with $($run.ExitCode)" }
          # The uninstaller runs on from a copy of itself in the temporary folder, so wait for it.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path -LiteralPath $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $dir) {
            Get-ChildItem -LiteralPath $dir -Force -Recurse | ForEach-Object FullName
            throw "the uninstaller left $dir behind"
          }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -like 'Clawtrate*' }
          if ($entry) { throw "the uninstaller left its uninstall entry" }
      # What a failed check saw: traces and error contexts.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-results
          path: test-results/
          retention-days: 3

  # Temporary: whether the development gateway can run on Windows.
  windows-gateway-probe:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm install --global --foreground-scripts openclaw@2026.10.6
        timeout-minutes: 15
      - run: openclaw --version
      - continue-on-error: true
        run: pnpm dev-gateway start --instance probe-windows
      - continue-on-error: true
        run: pnpm dev-gateway reset --instance probe-windows
