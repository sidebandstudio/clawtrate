name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      keychain:
        description: Run only the packaged Keychain check, on a discarded macOS runner
        type: boolean
        default: false
      # A run by hand holds a macOS runner only when asked to, so a run that proves something
      # on Linux or Windows does not wait for one, or keep main's own run waiting.
      macos:
        description: Run the macos job (Mac packaging, the Mac-only tests, the macOS screenshot set)
        type: boolean
        default: false
      visual:
        description: Run the screenshot tests in the Linux image
        type: boolean
        default: true

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Runs on main each get a group
# of their own, so every commit on main keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only documentation cannot change what the end-to-end, visual and
  # packaging jobs test, so they are skipped for it. `check` always runs: its unit tests read
  # docs/parity.md. Pushes to main run everything; runs by hand run what their inputs choose.
  #
  # The macos job runs on a pull request only when it changes one of MACOS_PATHS, the files the
  # job's steps use, or a Linux baseline that has a macOS twin (#392). A change that redraws a
  # picture in the macOS set redraws its Linux twin too, and the Linux job fails until that is
  # recorded, so the twin brings in the macos job. test/ci-macos-gate.test.ts checks
  # the list against the job's steps. Every push to main runs the macos job.
  #
  # The scenario check runs on a pull request only when it changes one of SCENARIOS_PATHS: the
  # development gateway, the files the check reaches outside it, the plugins it loads, the
  # OpenClaw pins, the root manifest, lockfile and workspace file, and this file (#693). The
  # app's own code under packages/ and apps/ is left out: the e2e job tests it on every change.
  # test/ci-scenarios-gate.test.ts checks the list against the check's imports. Every push to
  # main runs the check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      macos: ${{ steps.diff.outputs.macos }}
      visual: ${{ steps.diff.outputs.visual }}
      scenarios: ${{ steps.diff.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
          KEYCHAIN_ONLY: ${{ inputs.keychain == true }}
          MACOS_INPUT: ${{ inputs.macos == true }}
          VISUAL_INPUT: ${{ inputs.visual != false }}
          # Git pathspecs, read with :(glob). Workspace packages under packages/ are left out:
          # they hold no macOS code, and the Linux and Windows jobs test them on every change.
          MACOS_PATHS: |
            .github/workflows/ci.yml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            vitest.config.ts
            playwright.updates.config.ts
            playwright.visual.config.ts
            apps/desktop/package.json
            apps/desktop/electron.vite.config.ts
            apps/desktop/src/main/**
            apps/desktop/src/preload/**
            apps/desktop/src/setup/**
            apps/desktop/src/host/runtime.ts
            apps/desktop/src/web-host/setup-look.ts
            apps/desktop/packaging/**
            apps/desktop/resources/**
            apps/desktop/test/update/**
            apps/desktop/test/fixtures/local-gateway.ts
            apps/desktop/test/fixtures/openclaw-outputs.ts
            apps/desktop/test/settings-reader.test.ts
            apps/desktop/test/local-prove.test.ts
            apps/desktop/test/local-connect.test.ts
            apps/desktop/test/setup-connect-boundaries.test.ts
            apps/desktop/test/local-setup.test.ts
            tools/dev-gateway/src/instance.ts
            tools/dev-gateway/src/state-guard.ts
            tools/dev-gateway/src/endpoint.ts
            tools/brand/src/make-icons.ts
            tools/brand/src/png.ts
            assets/brand/logo.png
            assets/brand/generated.json
            e2e/ports.ts
            e2e-updates/**
            e2e-packaged/**
            visual/fixture.ts
            visual/shortcuts.visual.spec.ts
            visual/search.visual.spec.ts
            visual/messages.visual.spec.ts
            visual/shell.visual.spec.ts
            visual/baselines/darwin/**
            packages/ui/package.json
            packages/ui/src/styles/tokens.css
          # The same form. packages/core/package.json pins the gateway client and protocol, as
          # the development gateway's own package.json does. The root package.json, the lockfile
          # and pnpm-workspace.yaml decide what the job installs, Playwright's Chromium among it.
          SCENARIOS_PATHS: |
            .github/workflows/ci.yml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tools/dev-gateway/**
            e2e/scenario-check.ts
            e2e/global-setup.ts
            e2e/ports.ts
            e2e/run-record.ts
            plugins/clawtrate-computer/**
            plugins/clawtrate-dev-signin/**
            plugins/clawtrate-tool-rules/**
            packages/core/package.json
        run: |
          code=true
          macos=true
          visual=true
          scenarios=true
          # A run by hand for the Keychain check alone runs no other end-to-end or packaging job.
          if [ "$KEYCHAIN_ONLY" = "true" ]; then code=false; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            macos=$MACOS_INPUT
            visual=$VISUAL_INPUT
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Without rename detection a file moved into docs/ also lists the path it left.
            files=$(git diff --name-only --no-renames "origin/$BASE...HEAD")
            printf '%s\n' "$files"
            if ! printf '%s\n' "$files" | grep -qvE '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$)'; then
              code=false
            fi
            set -f
            pathspecs=$(printf '%s\n' "$MACOS_PATHS" | sed -e '/^$/d' -e 's/^/:(glob)/')
            # shellcheck disable=SC2086
            ours=$(git diff --name-only --no-renames "origin/$BASE...HEAD" -- $pathspecs)
            set +f
            twins=$(printf '%s\n' "$files" | sed -n 's#^visual/baselines/linux/##p' |
              while IFS= read -r name; do
                if [ -e "visual/baselines/darwin/$name" ]; then echo "visual/baselines/linux/$name"; fi
              done)
            if [ -n "$ours$twins" ]; then
              echo "The macos job runs for:"
              printf '%s\n' "$ours" "$twins" | sed '/^$/d'
            else
              echo "No file the macos job uses changed."
              macos=false
            fi
            set -f
            pathspecs=$(printf '%s\n' "$SCENARIOS_PATHS" | sed -e '/^$/d' -e 's/^/:(glob)/')
            # shellcheck disable=SC2086
            ours=$(git diff --name-only --no-renames "origin/$BASE...HEAD" -- $pathspecs)
            set +f
            if [ -n "$ours" ]; then
              echo "The scenario check runs for:"
              printf '%s\n' "$ours"
            else
              echo "No file the scenario check uses changed."
              scenarios=false
            fi
          fi
          # Jobs that test code run only when code does.
          if [ "$code" = "false" ]; then macos=false; visual=false; scenarios=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "visual=$visual" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lint, typecheck and unit tests do not start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A unit test reads the gateway's own tool-naming function from the installed package. The
      # tests read only the copy OPENCLAW_PACKAGE_DIR names; on this throwaway runner, that one.
      - run: npm install --global openclaw@2026.10.6
      - run: echo "OPENCLAW_PACKAGE_DIR=$(npm root --global)/openclaw" >> "$GITHUB_ENV"
      # The settings reader's test checks its pinned native-module hashes against this package.
      - run: echo "CLAWTRATE_PINNED_OPENCLAW=$(npm root --global)/openclaw" >> "$GITHUB_ENV"
      # The development gateway's browser tests start the Chromium that Playwright installs.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The suite runs one test at a time against one gateway, so it is split by file across three
  # runners, each with a gateway of its own. The lists in e2e/shards/ split the files by how long
  # each takes, so the runners finish together (#485).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gateway version the project tests against (docs/decisions.md), from the public registry.
      - run: npm install --global openclaw@2026.10.6
      # The development gateway runs this runner's copy, which is the pinned version.
      - run: echo "OPENCLAW_BIN=$(npm prefix --global)/bin/openclaw" >> "$GITHUB_ENV"
      - run: openclaw --version
      - run: pnpm exec playwright install --with-deps chromium
      # e2e/setup.spec.ts drives the desktop app's development build, which needs a display.
      # This runner's list; the last one also runs every spec file that no list names.
      - run: node e2e/shards.ts ${{ matrix.shard }} | tee "$RUNNER_TEMP/e2e-shard.txt"
      - run: xvfb-run --auto-servernum pnpm e2e --test-list "$RUNNER_TEMP/e2e-shard.txt"
      # What a failed check saw: traces and error contexts, kept for a few days.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  # What needs a Mac: the native helpers' tests, local connect's proof, the desktop update tests,
  # Mac packaging and the macOS screenshot set. On a pull request it runs only when its own
  # sources change (the changes job); every push to main runs it.
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    # The macOS baselines were taken on macOS 15; font rasterising differs between releases.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/desktop/test/update/mac-inspection.test.ts
      # A settings file another account owns, for the settings reader's owner check: made only on
      # a discarded GitHub-hosted runner, where sudo needs no password. The test only reads it.
      - if: runner.environment == 'github-hosted'
        run: |
          fixture=$(realpath "$(mktemp -d)")
          mkdir -m 700 "$fixture/fixture-home" "$fixture/fixture-home/.openclaw"
          file="$fixture/fixture-home/.openclaw/openclaw.json"
          printf '{}' > "$file"
          chmod 600 "$file"
          sudo -n chown root "$file"
          sudo -n chmod +a "$(id -un) allow read" "$file"
          echo "CLAWTRATE_OWNER_FIXTURE_HOME=$fixture/fixture-home" >> "$GITHUB_ENV"
      # The settings reader's macOS helper, built with packaging's flags.
      - run: pnpm exec vitest run apps/desktop/test/settings-reader.test.ts
      # Electron's install script is declined (pnpm-workspace.yaml); requiring the package fetches its binary.
      - run: node -e "require('electron')"
        working-directory: apps/desktop
      # The update folders under Electron's own fs, which reads app.asar as a folder (#383).
      - run: pnpm exec vitest run apps/desktop/test/update/asar-trees.test.ts
        env:
          CLAWTRATE_ELECTRON_FS_TESTS: "1"
      # Local connect's proof through the same helper, against development gateways of the tests'
      # own, from the public registry.
      - run: npm install --global openclaw@2026.10.6
      # Another account's listener, for local connect's check (e): started only on a discarded
      # GitHub-hosted runner, where sudo needs no password. It logs what it accepts and is sent;
      # the test only connects to it and reads the log.
      - if: runner.environment == 'github-hosted'
        run: |
          fixture=$(realpath "$(mktemp -d /tmp/clawtrate-other-account.XXXXXX)")
          chmod 755 "$fixture"
          cat > "$fixture/listener.pl" <<'EOF'
          use IO::Socket::INET;
          my ($port, $log) = @ARGV;
          my $server = IO::Socket::INET->new(LocalAddr => "127.0.0.1", LocalPort => $port, Listen => 16, ReuseAddr => 1) or die;
          open(my $out, ">>", $log) or die;
          $out->autoflush(1);
          print $out "ready\n";
          while (my $socket = $server->accept) {
            print $out "accepted\n";
            my $bytes = 0;
            while (sysread($socket, my $data, 4096)) { $bytes += length $data; print $out "bytes $bytes\n"; }
            close $socket;
          }
          EOF
          chmod 644 "$fixture/listener.pl"
          : > "$fixture/log"
          chmod 666 "$fixture/log"
          sudo -n -u nobody /usr/bin/perl "$fixture/listener.pl" 19417 "$fixture/log" > /dev/null 2>&1 &
          for attempt in $(seq 1 50); do grep -q ready "$fixture/log" && break; sleep 0.2; done
          grep -q ready "$fixture/log"
          echo "CLAWTRATE_OTHER_ACCOUNT_LISTENER=19417:$fixture/log" >> "$GITHUB_ENV"
      - run: OPENCLAW_BIN="$(npm prefix --global)/bin/openclaw" CLAWTRATE_LOCAL_GATEWAY=1 pnpm exec vitest run apps/desktop/test/local-prove.test.ts apps/desktop/test/local-connect.test.ts apps/desktop/test/setup-connect-boundaries.test.ts apps/desktop/test/local-setup.test.ts
      - run: pnpm exec playwright install chromium
      # On a Mac this runs only the macOS set (playwright.visual.config.ts).
      - run: pnpm visual
      # What a failed or flaky check saw: the first attempt's actual and difference pictures,
      # traces and attachments, even when the retry passed. Passing attempts leave their
      # folders empty, so this stays small.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-results
          path: test-results/
          retention-days: 3
      # Unsigned: no signing variables are set, so the app is signed ad hoc and not notarized.
      - run: pnpm test:desktop-updates
      - run: pnpm package:mac

  # Every screenshot test, in the pinned Linux image (visual/linux/), against
  # visual/baselines/linux/, split by test across three runners. This is the screenshot gate;
  # the macos job runs the small macOS set.
  visual-linux:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t clawtrate-visual visual/linux
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: visual-linux-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: visual-linux-pnpm-
      # The github reporter puts each runner's summary on the run's page, naming each test that
      # passed only on its retry, so a flaky check is seen without opening three logs.
      - run: bash visual/linux/run.sh --shard=${{ matrix.shard }}/3 --reporter=list,github
        env:
          CLAWTRATE_VISUAL_IMAGE: clawtrate-visual
          CLAWTRATE_VISUAL_STORE: ${{ runner.temp }}/pnpm-store
      # What a failed or flaky check saw, as on the macos job: the actual and difference pictures,
      # traces and attachments.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-linux-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  # One check for branch protection to require. A matrix job its `if` skips reports one check
  # named `visual-linux`, not the three shards' names, so requiring the shards would leave a
  # pull request that skips them waiting. This passes when every shard passed, or when the
  # changes job succeeded and chose to skip them; a failed changes job skips them too, and fails.
  visual:
    needs: [changes, visual-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.visual-linux.result }}
        run: |
          echo "changes: $CHANGES, visual-linux: $RESULT"
          [ "$CHANGES" = "success" ]
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  # `pnpm scenarios` on the development gateway's own pinned OpenClaw, the version
  # docs/decisions.md names (#693). On a pull request it runs only when the changes job says the
  # check's files changed; every push to main runs it. openclaw-latest.yml runs the same check
  # against npm's newest OpenClaw.
  scenario-check:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned OpenClaw, and a Node it supports, into the tool's own folder.
      - run: pnpm dev-gateway setup
      # The computer checks start the Chromium that Playwright installs.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm scenarios

  # The scenario check's one check for branch protection, as `visual` is the screenshot shards'.
  # A skipped job counts as passed, and a failed changes job skips scenario-check too. This passes
  # when the check passed, or when the changes job succeeded and chose to skip it.
  scenarios:
    needs: [changes, scenario-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.scenario-check.result }}
        run: |
          echo "changes: $CHANGES, scenario-check: $RESULT"
          [ "$CHANGES" = "success" ]
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # The repository's line endings, as on macOS and Linux.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the settings reader and the local proof on Windows
        run: pnpm exec vitest run apps/desktop/test/settings-reader.test.ts apps/desktop/test/local-connect.test.ts -t "reads nothing on Windows|in a production run|on Windows the proof refuses"
      # Both whole files, each case listed with its outcome, so one that is skipped shows as skipped.
      # The Windows-only case runs the read's script in Windows PowerShell with a stand-in Add-Type
      # that fails: nothing reads the real taskbar or the machine's processes.
      - name: Check the taskbar overlay read and its diagnostics on Windows
        run: pnpm exec vitest run ./test/windows.test.ts ./test/packaged-overlay-diagnostics.test.ts --reporter=verbose
      # Electron's install script is declined (pnpm-workspace.yaml); requiring the package fetches its binary.
      - run: node -e "require('electron')"
        working-directory: apps/desktop
      # The variable makes a missing binary fail the check instead of skipping it.
      - name: Check Electron's secure storage across a restart on Windows
        run: pnpm exec vitest run apps/desktop/test/windows-secure-storage.test.ts
        env:
          CLAWTRATE_WINDOWS_SAFE_STORAGE_TESTS: "1"
      # Unsigned: no signing variables are set.
      - run: pnpm test:desktop-updates
      - run: pnpm package:win
      # For inspection only: unsigned, and never a release.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: apps/desktop/dist/Clawtrate-*-win-x64.exe
          if-no-files-found: error
          retention-days: 3
      - name: Install for the current user, silently, into a folder of its own
        id: install
        run: |
          $installer = @(Get-ChildItem apps/desktop/dist/Clawtrate-*-win-x64.exe)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          # A space in the path, as a folder a person picks may have. NSIS takes /D= last and unquoted.
          $dir = Join-Path $env:RUNNER_TEMP "Clawtrate test.app\Contents\MacOS"
          $run = Start-Process $installer[0].FullName -ArgumentList '/S', '/currentuser', "/D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installer exited with $($run.ExitCode)" }
          foreach ($file in 'Clawtrate.exe', 'resources\app.asar', 'Uninstall Clawtrate.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "the installer did not write $file" }
          }
          # Its uninstall entry and its own key, both named by the GUID electron-builder derives from the app id.
          $entry = @(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -like 'Clawtrate*' })
          if ($entry.Count -ne 1) { throw "expected one uninstall entry for Clawtrate, found $($entry.Count)" }
          $entry | Select-Object PSChildName, DisplayName, DisplayVersion, Publisher | Format-List
          $guid = $entry[0].PSChildName
          $own = Get-ItemProperty -LiteralPath "HKCU:\Software\$guid"
          if ($own.InstallLocation -ne $dir) { throw "the installer's key names $($own.InstallLocation), not $dir" }
          # The copy of itself it keeps for an updater, in a folder of the user's local application data.
          $hash = (Get-FileHash -LiteralPath $installer[0].FullName).Hash
          $cache = @(Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Directory -Filter '*-updater' |
            Where-Object { (Test-Path -LiteralPath "$($_.FullName)\installer.exe") -and (Get-FileHash -LiteralPath "$($_.FullName)\installer.exe").Hash -eq $hash })
          if ($cache.Count -ne 1) { throw "expected one copy of the installer under $env:LOCALAPPDATA, found $($cache.Count)" }
          "installer's copy: $($cache[0].FullName)"
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Clawtrate.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Clawtrate.lnk'
          foreach ($link in $startMenu, $desktop) {
            if (-not (Test-Path -LiteralPath $link)) { throw "the installer did not make $link" }
          }
          # The silent install must not start the app; the check starts its own.
          $running = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$dir\*" }
          if ($running) { throw "the installer left the app running: $($running.ProcessId -join ', ')" }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "guid=$guid" >> $env:GITHUB_OUTPUT
          "cache=$($cache[0].FullName)" >> $env:GITHUB_OUTPUT
          "start-menu=$startMenu" >> $env:GITHUB_OUTPUT
          "desktop=$desktop" >> $env:GITHUB_OUTPUT
      - name: Check the Start menu shortcut opens the installed app under the app's own id
        env:
          DIR: ${{ steps.install.outputs.dir }}
          LINK: ${{ steps.install.outputs.start-menu }}
        run: |
          $appId = node --input-type=module -e "const m = await import('./apps/desktop/src/main/identity.ts'); console.log(m.APP_ID)"
          if (-not $appId) { throw "could not read the app id" }
          if (-not (Test-Path -LiteralPath $env:LINK)) { throw "there is no Start menu shortcut at $env:LINK" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($env:LINK).TargetPath
          $exe = Join-Path $env:DIR 'Clawtrate.exe'
          if ($target -ne $exe) { throw "the Start menu shortcut opens '$target', not '$exe'" }
          $item = (New-Object -ComObject Shell.Application).Namespace((Split-Path $env:LINK)).ParseName((Split-Path $env:LINK -Leaf))
          $linkId = $item.ExtendedProperty('System.AppUserModel.ID')
          if ($linkId -ne $appId) { throw "the Start menu shortcut's AppUserModelID is '$linkId', not the app's '$appId'" }
          "$env:LINK opens $target as $linkId"
      - name: Run the launch check against the installed app
        env:
          CLAWTRATE_PACKAGED_APP: ${{ steps.install.outputs.dir }}
        run: pnpm check:packaged
      # Also after a failed check, so the uninstall is exercised whenever something was installed.
      - name: Uninstall silently and check nothing of the installer's is left
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DIR: ${{ steps.install.outputs.dir }}
          GUID: ${{ steps.install.outputs.guid }}
          CACHE: ${{ steps.install.outputs.cache }}
          START_MENU: ${{ steps.install.outputs.start-menu }}
          DESKTOP: ${{ steps.install.outputs.desktop }}
        run: |
          $run = Start-Process (Join-Path $env:DIR 'Uninstall Clawtrate.exe') -ArgumentList '/S' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the uninstaller exited with $($run.ExitCode)" }
          # Everything the installer made: the app's folder, the copy of itself, its shortcuts and its two keys.
          $owned = @(
            $env:DIR, $env:CACHE, $env:START_MENU, $env:DESKTOP,
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:GUID",
            "HKCU:\Software\$env:GUID"
          )
          # The uninstaller carries on from a copy of itself in the temporary folder, so wait for it.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $left = @($owned | Where-Object { Test-Path -LiteralPath $_ })
            if ($left.Count -eq 0) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if ($left.Count -gt 0) {
            foreach ($path in $left) {
              $path
              if (-not $path.StartsWith('HKCU:') -and (Test-Path -LiteralPath $path -PathType Container)) {
                Get-ChildItem -LiteralPath $path -Force -Recurse | ForEach-Object { "  $($_.FullName)" }
              }
            }
            throw "the uninstaller left $($left.Count) of the installer's paths behind"
          }
          "removed: $($owned -join '; ')"
      # What a failed check saw: Playwright's error context for each failed test.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-results
          path: test-results/
          retention-days: 3

  # The packaged Keychain check (docs/development/packaging.md), by hand only: it needs a default
  # login keychain no person uses, so the job makes one on a runner that is discarded afterwards.
  keychain:
    if: github.event_name == 'workflow_dispatch' && inputs.keychain
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gateway version the project tests against (docs/decisions.md), from the public registry.
      - run: npm install --global openclaw@2026.10.6
      # The development gateway runs this runner's copy, which is the pinned version.
      - run: echo "OPENCLAW_BIN=$(npm prefix --global)/bin/openclaw" >> "$GITHUB_ENV"
      - name: Make a disposable keychain the default
        id: keychain
        run: |
          path="$RUNNER_TEMP/clawtrate-check-$(openssl rand -hex 8).keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$path"
          security set-keychain-settings -lut 3600 "$path"
          security unlock-keychain -p "$password" "$path"
          security list-keychains -d user -s "$path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$path"
          default="$(security default-keychain -d user | tr -d '" ')"
          echo "default keychain: $default"
          echo "path=$default" >> "$GITHUB_OUTPUT"
      # The Keychain test copies the pairing the pairing test makes, which fills the form the
      # first test opens, so all three run.
      - name: Run the Keychain check
        env:
          # The seeded `ls` result is in byte order, as Linux runners sort it; the macOS runner's
          # en_US.UTF-8 would put `changes` before the capitalised files.
          LC_ALL: C
          CLAWTRATE_CHECK_KEYCHAIN: "1"
          CLAWTRATE_CHECK_KEYCHAIN_PATH: ${{ steps.keychain.outputs.path }}
        run: pnpm check:packaged -g "opens its window from the packaged app|pairs with its own development gateway instance|Keychain"
      - name: Delete the disposable keychain
        if: ${{ always() && steps.keychain.outputs.path != '' }}
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          # The items' names only, never their values: what the run left in its own keychain.
          security dump-keychain "$KEYCHAIN" | grep -E '"(svce|acct|labl)"' || true
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: keychain-check-results
          path: test-results/
          retention-days: 3
