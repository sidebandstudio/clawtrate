name: Bug report
description: Something in Clawtrate does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Leave out hostnames, IP addresses, tokens, and anything from your bots' conversations that you would not post publicly.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm dev-gateway start
        2. Open the web preview and send #steps to Juniper
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app on macOS
        - Desktop app on Windows
        - Web preview
        - iOS app
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clawtrate commit
      description: The output of `git rev-parse --short HEAD` in your checkout.
  - type: input
    id: openclaw
    attributes:
      label: OpenClaw version
      description: The output of `openclaw --version`.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
