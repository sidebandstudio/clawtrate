version: 2

updates:
  # The pnpm workspace, from the root where pnpm-lock.yaml lives.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Pinned to the gateway version the project tests against (docs/decisions.md, "Versions").
      # They move only together with that version, by hand.
      - dependency-name: "openclaw"
      - dependency-name: "@openclaw/*"
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
